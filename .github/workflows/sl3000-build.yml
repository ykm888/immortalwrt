name: SL3000-V13.5-Full-Fix

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 环境清理与磁盘扩容
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo docker image prune -a -f
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev

      - name: 4. 克隆源码
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 5. 运行补丁脚本 (全量修复注入)
        run: |
          # 确保脚本有执行权限
          chmod +x scripts/sl3000-patch.sh
          # 运行脚本：它会自动处理 sl3000.config 和 filogic.mk
          ./scripts/sl3000-patch.sh

      - name: 6. 编译工具链 (劫持路径延续版)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 7. 内核准备与 DTS 动态注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          
          # 定位内核源码中的 DTS 目录并强制覆盖
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            echo "🎯 发现内核 DTS 路径: $K_DTS_DIR"
            cp -fv ../custom-config/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
            # 兼容性同步
            cp -fv "$K_DTS_DIR/mt7981b-sl3000-emmc.dts" "$K_DTS_DIR/mt7981-sl3000-emmc.dts"
            # 注册到内核 Makefile
            sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
          fi

      - name: 8. 执行编译与打包 (一次性解决路径)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 🎯 核心修复：强制建立 root-mediatek 防止 Error 1
          mkdir -p build_dir/target-aarch64_cortex-a53_musl/root-mediatek
          
          # 编译内核
          make target/linux/compile -j$(nproc) V=s
          # 执行安装 (指定生成的设备 Profile)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y V=s

      - name: 9. 发布固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-V13.5-Final-${{ github.run_id }}
          files: |
            ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
            ${{ env.WORKDIR }}/.config
          token: ${{ secrets.GITHUB_TOKEN }}
