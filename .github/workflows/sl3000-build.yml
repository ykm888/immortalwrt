name: SL3000-V13.5-Full-Fix

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  # 🎯 核心同步：强制指定设备名，确保路径与 MK 文件一致
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 环境清理与磁盘扩容
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          # 释放磁盘空间
          sudo docker image prune -a -f
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile # 稍微加大 Swap 应对 1GB 镜像打包
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev qemu-utils

      - name: 4. 克隆源码与同步 Feeds
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}
          cd ${{ env.WORKDIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 注入三件套配置 (DTS/MK/CONFIG)
        run: |
          # 1. 注入并强制覆盖 DTS (内核源码层)
          # 注意：此步在 prepare 后会再次执行以防被覆盖
          mkdir -p ${{ env.WORKDIR }}/target/linux/mediatek/dts/
          cp -fv custom-config/mt7981b-sl3000-emmc.dts ${{ env.WORKDIR }}/target/linux/mediatek/dts/
          
          # 2. 注入 MK (打包逻辑层)
          cp -fv custom-config/filogic.mk ${{ env.WORKDIR }}/target/linux/mediatek/image/filogic.mk
          
          # 3. 注入 .config (全局变量层)
          cp -fv custom-config/seed.config ${{ env.WORKDIR }}/.config
          cd ${{ env.WORKDIR }}
          make defconfig

      - name: 6. 编译工具链 (增加环境稳固)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 7. 内核准备与 DTS 强力绑定
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          
          # 🎯 彻底修复：无论内核版本如何变化，强制定位并注入 DTS
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            cp -fv target/linux/mediatek/dts/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
            # 兼容性同步：某些版本可能寻找不带 'b' 的文件名
            cp -fv "$K_DTS_DIR/mt7981b-sl3000-emmc.dts" "$K_DTS_DIR/mt7981-sl3000-emmc.dts"
            
            # 强制修改内核 Makefile 确保编译 dtb
            sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
          fi

      - name: 8. 执行最终编译 (彻底解决路径缺失)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 🎯 核心修复：手动建立 root-mediatek 目录，防止 Error 1
          mkdir -p build_dir/target-aarch64_cortex-a53_musl/root-mediatek
          
          # 编译内核
          make target/linux/compile -j$(nproc) V=s
          # 执行打包 (针对特定设备)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y V=s

      - name: 9. 整理并发布固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-V13.5-Final-${{ github.run_id }}
          files: |
            ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
            ${{ env.WORKDIR }}/.config
          token: ${{ secrets.GITHUB_TOKEN }}
