name: SL3000_FIP_EXCLUSIVE_EXTRACT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 物理环境初始化
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt update && sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc dos2unix
          sudo fallocate -l 16G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 克隆源码 (24.10)
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 执行物理修复补丁 (架构隔离)
        run: |
          dos2unix scripts/sl3000-patch.sh && chmod +x scripts/sl3000-patch.sh
          bash -x ./scripts/sl3000-patch.sh

      - name: 核心构建 (生成 U-Boot 与系统)
        working-directory: ./openwrt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          make defconfig
          # 为了快速得到 FIP，我们优先编译 bootloader
          make package/boot/uboot-mediatek/compile V=s -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: 🚀 物理死锁：定向提取 FIP 固件
        run: |
          mkdir -p OUTPUT
          
          # 策略 A：物理打捞 bin 目录（标准路径）
          echo "Scanning bin directory for FIP..."
          find openwrt/bin/targets/mediatek/filogic/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*bl2*" \) -exec cp -v {} OUTPUT/ \; || true
          
          # 策略 B：物理强行打捞 build_dir（构建现场）
          # 这是最保险的一招，即使 OpenWrt 没搬运，我们手动从源码产出目录物理截获
          echo "Scanning build_dir for raw FIP artifacts..."
          find openwrt/build_dir/ -name "*mt7981_sl3000*fip.bin" -exec cp -v {} OUTPUT/ \; || true
          find openwrt/build_dir/ -name "*mt7981_sl3000*u-boot.bin" -exec cp -v {} OUTPUT/ \; || true
          
          # 策略 C：系统固件备份
          find openwrt/bin/targets/mediatek/filogic/ -name "*sl3000*sysupgrade.bin" -exec cp -v {} OUTPUT/ \; || true

      - name: 自动发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-FIP-GOT-${{ github.run_id }}
          files: OUTPUT/*
