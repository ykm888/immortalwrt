name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境初始化"
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 rsync unzip zlib1g-dev swig
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 Clone & Feeds (24.10)"
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: "🛠️ 执行物理补丁 (根目录调用)"
        # 注意：此处不在 openwrt 目录运行，让脚本自定位
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: "🏗️ 编译固件"
        working-directory: ./openwrt
        run: |
          make defconfig FORCE=1
          make target/linux/clean FORCE=1
          # 执行全流程构建
          make -j$(nproc) || make -j1 V=s

      - name: "📦 上传与发布"
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-v24.10-${{ github.run_id }}
          files: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.config
