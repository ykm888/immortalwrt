name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc
  CACHE_KEY: sl3000-v2026-final

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. 🚀 [极致优化] 腾出磁盘空间 & 12G Swap"
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h

      - name: "3. 安装依赖"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget qemu-utils device-tree-compiler libelf-dev

      - name: "4. 🛡️ [物理缓存] 恢复工具链快照"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-${{ env.CACHE_KEY }}-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-sl3000-

      - name: "5. 克隆源码"
        run: |
          [ -d "${{ env.WORKDIR }}" ] || git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "6. 运行补丁脚本"
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: "7. 更新 feeds"
        working-directory: ${{ env.WORKDIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: "8. 🛠️ [关键修复] 完整构建 host tools (包含 usign)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 确保 .config 存在
          make defconfig
          
          # 按顺序构建所有 host tools，确保 usign 被编译
          echo "Building host tools..."
          make tools/install -j$(nproc) V=s || make tools/install -j1 V=s
          
          # 验证 usign 是否存在
          if [ ! -f "staging_dir/host/bin/usign" ]; then
            echo "❌ usign not found, building explicitly..."
            make tools/usign/clean
            make tools/usign/compile V=s
            make tools/usign/install V=s
          fi
          
          # 再次验证
          ls -la staging_dir/host/bin/usign || exit 1
          echo "✅ usign found at: $(readlink -f staging_dir/host/bin/usign)"

      - name: "9. 构建工具链"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make toolchain/install -j$(nproc) V=s || make toolchain/install -j1 V=s

      - name: "10. 🔥 [内核准备] 注入 DTS"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc) || make target/linux/prepare -j1 V=s
          
          DTS_FILE="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          if [ -f "$DTS_FILE" ]; then
            find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
              cp -fv "$DTS_FILE" "$dts_path/"
              if ! grep -q "mt7981b-sl3000-emmc.dtb" "$dts_path/Makefile"; then
                echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$dts_path/Makefile"
              fi
            done
          fi

      - name: "11. 编译内核"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/compile -j$(nproc) V=s || make target/linux/compile -j1 V=s

      - name: "12. 编译软件包"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make package/compile -j$(nproc) V=s || make package/compile -j1 V=s

      - name: "13. ✅ [关键修复] 生成软件包索引 (修复 usign 问题)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 再次确认 usign 存在
          export 
