name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc
  CACHE_KEY: sl3000-v2026-final

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. 🚀 腾出磁盘空间 & 12G Swap"
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h

      - name: "3. 安装依赖"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget qemu-utils device-tree-compiler libelf-dev

      - name: "4. 克隆 ImmortalWrt 源码"
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "5. 复制脚本 & 执行补丁（✅ 去掉缓存，直接跑，永不卡住）"
        working-directory: ${{ env.WORKDIR }}
        run: |
          cp -rf ../scripts ./
          cp -rf ../custom-config ./
          chmod +x scripts/clean-feeds.sh
          chmod +x scripts/build.sh
          ./scripts/clean-feeds.sh
          ./scripts/build.sh

      - name: "6. 编译固件"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make -j$(nproc) V=w

      - name: "7. 上传固件"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_NAME }}-firmware
          path: ${{ env.WORKDIR }}/bin/targets/*/*
