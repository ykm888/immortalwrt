name: SL3000-V13-Smart-Build

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. [延续修复] 磁盘扩容与 Swap 彻底重置
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 安装环境并克隆源码
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 执行注入脚本
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: 5. 编译 Host 工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=/usr/bin:$PATH
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 6. [V13 智能加固] 地毯式 DTS 探测与注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 延续修复：解压内核
          make target/linux/prepare -j$(nproc)
          
          # 寻找所有可能的 Mediatek DTS 目录
          K_DTS_DIRS=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d)
          
          for DTS_DIR in $K_DTS_DIRS; do
            echo "🎯 正在处理目录: $DTS_DIR"
            
            # 【自动匹配逻辑】探测内核使用 mt7981 还是 mt7981b
            if [ -f "$DTS_DIR/mt7981b.dtsi" ]; then
                TARGET_DTSI="mt7981b.dtsi"
            else
                TARGET_DTSI="mt7981.dtsi"
            fi
            echo "🔍 检测到内核基准文件: $TARGET_DTSI"

            # 动态改名并注入：替换 DTS 里的 include 行
            sed "s/mt7981.*\.dtsi/$TARGET_DTSI/g" "custom_files/mt7981b-sl3000-emmc.dts" > "$DTS_DIR/mt7981b-sl3000-emmc.dts"
            
            # 兼容性副本：复制一份不带 b 的，确保万无一失
            cp -f "$DTS_DIR/mt7981b-sl3000-emmc.dts" "$DTS_DIR/mt7981-sl3000-emmc.dts"

            # 在 Makefile 中精准注册
            K_MAKEFILE="$DTS_DIR/Makefile"
            if [ -f "$K_MAKEFILE" ]; then
              sed -i '/sl3000-emmc.dtb/d' "$K_MAKEFILE"
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981-sl3000-emmc.dtb' >> "$K_MAKEFILE"
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_MAKEFILE"
            fi
          done

      - name: 7. [延续修复] 最终生产
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          export PATH=/usr/bin:${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          
          make target/linux/compile -j$(nproc) V=s
          make target/install -j$(nproc) V=s

      - name: 8. 发布 Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-eMMC-Final-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc-sysupgrade.bin
          token: ${{ secrets.GITHUB_TOKEN }}
