name: SL3000-Ultimate-Factory-V4

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出配置仓库
        uses: actions/checkout@v4

      - name: 2. 环境清理与 Swap 动态扩容
        run: |
          sudo docker image prune -a -f || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 构建依赖安装
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev ccache
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 执行专属注入
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: 5. 编译基础工具链 (关键路径保护)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 6. [核心锁死] DTS 全路径覆盖与 Makefile 劫持
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          cp -fv custom_files/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
          cp -fv custom_files/mt7981b-sl3000-emmc.dts "$(dirname "$K_DTS_DIR")/"
          K_MAKEFILE="$K_DTS_DIR/Makefile"
          if ! grep -q "mt7981b-sl3000-emmc.dtb" "$K_MAKEFILE"; then
            sed -i '/dtb-$(CONFIG_ARCH_MEDIATEK)/a \dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' "$K_MAKEFILE"
          fi

      - name: 7. 极速全量编译 (环境变量硬化)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 强制指定 bison 寻找路径，解决 m4sugar.m4 缺失问题
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          
          # 编译并记录日志
          make target/linux/compile -j$(nproc) 2>&1 | tee -a ../build.log
          make package/compile -j$(nproc) 2>&1 | tee -a ../build.log
          make target/install -j$(nproc) 2>&1 | tee -a ../build.log

      - name: 8. 发布工厂固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-ProMax-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 故障深度诊断
        if: failure()
        run: |
          echo "==================== 🚨 ERROR ANALYSIS 🚨 ===================="
          if grep -qi "m4sugar.m4" build.log; then
             echo "❌ [诊断]: 依然存在工具链路径冲突！"
          elif grep -qi "syntax error" build.log; then
             echo "❌ [诊断]: DTS 语法错误。"
          else
             echo "❌ [诊断]: 未知错误，请检查下方日志。"
          fi
          tail -n 100 build.log
          echo "=============================================================="
