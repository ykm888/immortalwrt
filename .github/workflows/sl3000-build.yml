name: SL3000-Extreme-Final
on:
  workflow_dispatch:
env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: "🚀 极致空间优化 & 12G Swap"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev
      - name: "克隆源码"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}
      - name: "执行补丁脚本"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh
      - name: "🛠️ [加速修复] 工具链物理重建"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 物理对齐：先并行提速，失败再单线程自愈
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
      - name: "🔥 内核 DTS 物理强灌 (2/8 补丁)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          DTS_FILE="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv "$DTS_FILE" "$dts_path/"
            if ! grep -q "mt7981b-sl3000-emmc.dtb" "$dts_path/Makefile"; then
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$dts_path/Makefile"
            fi
          done
      - name: "✅ 全链路自愈编译 (延续全部设置)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          TCPATH=$(find ${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir -name "bin" -type d | grep "toolchain" | head -n 1)
          [ -n "$TCPATH" ] && export PATH="$TCPATH:$PATH"
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y
      - name: "📦 自动发布 Release"
        if: always()
        working-directory: ${{ env.WORKDIR }}
        run: |
          mkdir -p ../release_bins
          find bin/targets -type f -size +10M -name "*sysupgrade.bin" -exec cp -v {} ../release_bins/ \; || true
      - name: "🚀 发布 GitHub Release"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Clean-v500-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🛡️ 保存物理封印缓存"
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
          key: ${{ runner.os }}-sl3000-chain-v700-clean
