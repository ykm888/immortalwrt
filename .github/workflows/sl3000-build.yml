name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4

      - name: System Cleanup and Setup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
                      /usr/lib/jvm /usr/local/lib/node_modules /usr/local/bin/aliyun /usr/local/bin/azcopy || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils libelf-dev python3-setuptools
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: Clone ImmortalWrt
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Update Feeds
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Run patch script
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make defconfig
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      # 物理核心修复：移除 clean，屏蔽交互，双重锁定 128MB 分区
      - name: Build Firmware
        working-directory: ./openwrt
        run: |
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          
          # 第一次强灌锁定配置
          rm -rf tmp
          cp -fv .config.locked .config
          
          # 非交互式补全 (彻底解决 Error opening terminal)
          make defconfig
          
          # 第二次强灌：物理死锁，防止 U-Boot 选项被自动取消
          cp -fv .config.locked .config
          
          # 执行编译，必须产出 fip.bin
          make -j$(nproc) || make -j1 V=s
          cp .config bin/targets/mediatek/filogic/3000-emmc.config || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SL3000-Final-Artifacts
          path: openwrt/bin/targets/mediatek/filogic/**

      - name: Auto Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-Final-Ready
          name: "SL3000 最终修复版 (请先刷 fip.bin)"
          body: |
            ### ⚠️ 重要刷机指南
            1. 下载 `fip.bin`。
            2. 在 U-Boot 中点击 'U-BOOT UPDATE' 刷入 `fip.bin`。
            3. 重启后，点击 'FIRMWARE UPDATE' 刷入 `sysupgrade.bin`。
          files: |
            openwrt/bin/targets/mediatek/filogic/**/*.bin
            openwrt/bin/targets/mediatek/filogic/**/*.config
