name: SL3000_Dedicated_SelfHealing_Build

on:
  workflow_dispatch: # 物理锁定：仅允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-Healing Environment Setup
        run: |
          # 1. 延续设置：清理冗余空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          
          # 2. 空间自愈：如果磁盘空间不足则强制深度清理
          FREE_SPACE=$(df -h / | awk 'NR==2 {print $4}' | sed 's/G//')
          if [ $(echo "$FREE_SPACE < 10" | bc) -ne 0 ]; then
            sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules || true
          fi

          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc
          
          # 3. 物理修复：Text file busy 报错保护
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

      - name: Clone & Patch
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a
          chmod +x ../scripts/sl3000-patch.sh
          ../scripts/sl3000-patch.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make defconfig
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Build Firmware (Config Self-Healing)
        working-directory: ./openwrt
        run: |
          # 物理禁言自愈：强制应用锁定配置，禁止交互
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          cp -fv .config.locked .config
          yes "" | make olddefconfig
          
          # 物理检查：确保 128MB 锁定未被源码更新冲掉
          grep "DEVICE_3000-emmc=y" .config || (echo "❌ 配置物理死锁失效"; exit 1)
          
          make -j$(nproc) || make -j1 V=s

      - name: Precise Artifact Extraction
        working-directory: ./openwrt
        run: |
          mkdir -p ../OUTPUT
          # 模糊匹配自愈：根据物理关键字提取所有相关固件
          find bin/targets/mediatek/filogic/ -name "*3000-emmc-sysupgrade.bin" -exec cp -v {} ../OUTPUT/ \;
          find bin/targets/mediatek/filogic/ -name "*u-boot*" -exec cp -v {} ../OUTPUT/ \;
          find bin/targets/mediatek/filogic/ -name "*fip*" -exec cp -v {} ../OUTPUT/ \;
          cp .config ../OUTPUT/build_final.config

      - name: Auto Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-v24.10-${{ github.run_id }}
          name: "SL3000 专属修复版 (物理对齐 128MB)"
          files: OUTPUT/*
