name: SL3000_24.10_Dedicated_Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System Cleanup & Env Setup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: Clone ImmortalWrt
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Update Feeds
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Physical Patching
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make defconfig
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Build Firmware (Physical Silence)
        working-directory: ./openwrt
        run: |
          # 1. 物理禁言：彻底解决 mconf 交互死锁
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          cp -fv .config.locked .config
          make olddefconfig
          
          # 2. 物理确认 ID 是否正确锁定
          grep "DEVICE_3000-emmc=y" .config || (echo "❌ Device ID Matching Failed" && exit 1)
          
          # 3. 执行构建
          make -j$(nproc) || make -j1 V=s

      - name: Precise Artifact Extraction
        working-directory: ./openwrt
        run: |
          mkdir -p ../OUTPUT
          # 抓取系统固件
          find bin/targets/mediatek/filogic/ -name "*3000-emmc-sysupgrade.bin" -exec cp -v {} ../OUTPUT/ \;
          # 抓取 U-Boot (可能叫 fip 或 u-boot)
          find bin/targets/mediatek/filogic/ -name "*u-boot*" -exec cp -v {} ../OUTPUT/ \;
          find bin/targets/mediatek/filogic/ -name "*fip*" -exec cp -v {} ../OUTPUT/ \;
          # 备份最终配置
          cp .config ../OUTPUT/build_final.config

      - name: Auto Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Ready
          name: "SL3000 24.10 修复版 (ID: sl,3000-emmc)"
          files: OUTPUT/*
