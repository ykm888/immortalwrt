name: SL-3000-AutoBuild

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: custom-config/sl3000.config
  DIY_SH: scripts/sl3000-patch.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y $(curl -fsSL https://raw.githubusercontent.com/p3terx/Actions-OpenWrt/main/debian-setup)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Physical Patch & Update Feeds
      run: |
        cd openwrt
        # 物理复制整合脚本
        cp ../$DIY_SH ./patch.sh
        chmod +x patch.sh
        # [物理触发 1]：完成 Feeds 注入与目录创建
        ./patch.sh 
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & Pre-Build Audit
      run: |
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        # [关键修复]：物理移除旧的 bin 目录，防止缓存干扰 U-Boot 产物路径
        rm -rf bin/
        # [物理触发 2]：物理锁定内核版本与 U-Boot 编译包开关
        ./patch.sh
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        # 物理执行构建，开启详细日志输出以便熔断检查
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Firmware-Package
        # 物理包含所有 bin 文件，确保 fip.bin 能够被正确收集
        path: |
          openwrt/bin/targets/mediatek/filogic/*.bin
          openwrt/bin/targets/mediatek/filogic/*.tar.gz
