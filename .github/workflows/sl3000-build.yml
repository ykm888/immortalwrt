name: SL3000-Final-Firmware (With Space Optimization + Debug Log)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # 1. 检出代码
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          quiet: true

      # 2. 初始空间清理
      - name: Initial Disk Space Optimization
        run: |
          df -h
          sudo apt-get autoremove -y -qq > /dev/null 2>&1
          sudo apt-get clean -qq > /dev/null 2>&1
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/lib/docker /opt/* > /dev/null 2>&1
          df -h
        continue-on-error: true

      # 3. 安装依赖+清理缓存
      - name: Install Dependencies + Clean Cache
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential subversion libncurses5-dev zlib1g-dev gawk gcc-multilib \
            flex git-core gettext libssl-dev unzip texinfo libtool bison sharutils \
            curl wget rsync python3 python3-pip python3-setuptools python3-yaml \
            quilt patchutils m4 bc xz-utils libexpat1-dev libz-dev > /dev/null 2>&1
          sudo apt-get clean -qq > /dev/null 2>&1
          sudo rm -rf /var/lib/apt/lists/* > /dev/null 2>&1
        continue-on-error: false

      # 4. 克隆源码+清理旧文件
      - name: Clone ImmortalWrt 24.10 + Clean Old Files
        run: |
          rm -rf openwrt > /dev/null 2>&1
          git clone --depth=1 -b openwrt-24.10 --quiet https://github.com/immortalwrt/immortalwrt.git openwrt > /dev/null 2>&1
          [ -d "openwrt" ] || exit 1
          cd openwrt && git gc --quiet > /dev/null 2>&1

      # 5. 复制配置
      - name: Copy Custom Configs (Your Path)
        run: |
          mkdir -p openwrt/target/linux/mediatek/{dts,image} > /dev/null 2>&1
          cp -fv custom-config/mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/ > /dev/null 2>&1
          cp -fv custom-config/filogic.mk openwrt/target/linux/mediatek/image/ > /dev/null 2>&1
          grep -q "mt7981b-sl3000-emmc.dtb" openwrt/target/linux/mediatek/dts/Makefile || \
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> openwrt/target/linux/mediatek/dts/Makefile > /dev/null 2>&1

      # 6. 执行你的脚本
      - name: Run Your sl3000-patch.sh (Your Path)
        run: |
          chmod +x scripts/sl3000-patch.sh > /dev/null 2>&1
          cd openwrt && ../scripts/sl3000-patch.sh > /dev/null 2>&1
          [ -f ".config" ] || { echo "❌ 脚本执行后未生成 .config 文件"; exit 1; }

      # 7. 编译前空间清理
      - name: Pre-Build Space Cleanup
        working-directory: ./openwrt
        run: |
          make clean > /dev/null 2>&1
          make dirclean > /dev/null 2>&1
          find dl/ -type f -size 0 -delete > /dev/null 2>&1
          df -h

      # 8. 生成配置（无 EOF）
      - name: Generate Config (No EOF)
        working-directory: ./openwrt
        run: |
          > .config
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_SILENT_BUILD=y" >> .config
          echo "CONFIG_SILENT_PRINT_ON_ERROR=y" >> .config
          [ -f ../custom-config/sl3000.config ] && cat ../custom-config/sl3000.config >> .config 2>/dev/null
          make defconfig > /dev/null 2>&1
          sed -i 's/CONFIG_TARGET_KERNEL_PARTSIZE=.*/CONFIG_TARGET_KERNEL_PARTSIZE=128/' .config
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/' .config

      # 9. 下载依赖+清理冗余
      - name: Download Dependencies + Clean Redundant
        working-directory: ./openwrt
        run: |
          make download -j$(nproc) > /dev/null 2>&1
          find dl/ -type f -name "*.tar.*" -size 0 -delete > /dev/null 2>&1
          [ "$(ls -A dl/ 2>/dev/null)" ] || { echo "❌ 依赖包下载失败，dl 目录为空"; exit 1; }

      # 10. 分步编译
      - name: Build Firmware (Full Process)
        working-directory: ./openwrt
        run: |
          make tools/install -j1 V=s SILENT=1
          make toolchain/install -j1 V=s SILENT=1
          make target/linux/compile -j1 V=s SILENT=1
          make package/compile -j1 V=s SILENT=1
          make package/install -j1 V=s SILENT=1
          make target/install -j1 V=s SILENT=1
          make image/install -j1 V=s SILENT=1

      # 11. 编译后清理
      - name: Post-Build Space Cleanup
        working-directory: ./openwrt
        run: |
          make clean > /dev/null 2>&1
          rm -rf build_dir/tmp/ staging_dir/host/ > /dev/null 2>&1
          find bin/targets/mediatek/filogic -type f ! -name "*sl3000-emmc*.bin" ! -name "*sl3000-emmc*.img" -delete > /dev/null 2>&1
          df -h

      # 🔥 核心优化：未生成固件时打印排查日志
      - name: Verify Firmware + Debug Log
        working-directory: ./openwrt
        run: |
          echo "=== 开始验证固件 ==="
          # 查找有效固件（大小>10M，匹配设备名）
          FIRMWARE=$(find bin/targets/mediatek/filogic -type f -size +10M -name "*sl3000-emmc*.bin" -o -name "*sl3000-emmc*.img")
          
          if [ -n "$FIRMWARE" ]; then
            echo "✅ 固件生成成功：$FIRMWARE"
            echo "=== 固件信息 ==="
            ls -lah $FIRMWARE
            exit 0
          else
            echo "❌ 未生成有效固件！开始打印排查日志："
            echo -e "\n=== 1. 固件目录完整列表（查看是否有其他产物） ==="
            ls -lah bin/targets/mediatek/filogic/
            echo -e "\n=== 2. 编译目录状态（查看是否有构建产物） ==="
            ls -lah build_dir/target-aarch64_cortex-a53_musl/ 2>/dev/null || echo "build_dir 目录不存在"
            echo -e "\n=== 3. .config 配置关键信息（排查配置错误） ==="
            grep -E "CONFIG_TARGET_|CONFIG_PACKAGE_|CONFIG_KERNEL_PARTSIZE|CONFIG_ROOTFS_PARTSIZE" .config
            echo -e "\n=== 4. 设备配置文件存在性（排查 DTS/MK 复制失败） ==="
            ls -lah target/linux/mediatek/dts/mt7981b-sl3000-emmc.dts 2>/dev/null || echo "❌ DTS 文件不存在"
            ls -lah target/linux/mediatek/image/filogic.mk 2>/dev/null || echo "❌ MK 文件不存在"
            grep -q "mt7981b-sl3000-emmc.dtb" target/linux/mediatek/dts/Makefile && echo "✅ DTS 已加入编译列表" || echo "❌ DTS 未加入编译列表"
            echo -e "\n=== 5. 依赖包下载状态（排查依赖缺失） ==="
            ls -lah dl/ | head -20  # 显示前20个依赖包
            echo -e "\n=== 6. 最近编译日志片段（排查编译失败） ==="
            # 查找最近的编译日志文件，打印最后100行
            LOG_FILE=$(find . -name "*.log" -type f -mtime -1 | tail -1)
            if [ -n "$LOG_FILE" ]; then
              echo "最近的日志文件：$LOG_FILE"
              tail -100 $LOG_FILE
            else
              echo "未找到编译日志文件"
            fi
            exit 1  # 终止工作流，提示错误
          fi

      # 12. 上传产物
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*
          quiet: true
