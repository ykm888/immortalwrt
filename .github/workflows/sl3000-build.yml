name: SL3000-1GB-Final-Fixed

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出本地仓库 (包含脚本和配置)
        uses: actions/checkout@v4

      - name: 2. 安装环境
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix

      - name: 3. 克隆 ImmortalWrt 源码
        run: git clone --depth=1 -b ${{ env.SOURCE_BRANCH }} ${{ env.SOURCE_REPO }} ${{ env.WORKDIR }}

      - name: 4. 执行注入补丁 (修复路径查找)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 直接使用检出仓库里的脚本，避免路径迷失
          chmod +x ../scripts/sl3000-patch.sh
          ../scripts/sl3000-patch.sh

      - name: 5. 编译工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 6. 内核初始化 (解决模块依赖)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make target/linux/compile -j$(nproc)

      - name: 7. 编译软件包
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make package/compile -j$(nproc) || make package/compile -j1 V=s

      - name: 8. 锁定 DTS 并生成最终镜像
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          
          # 寻找内核 DTS 目录并强制覆盖
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          cp -fv "${{ github.workspace }}/fixed_files/sl3000.dts" "$K_DTS_DIR/mt7981b-sl3000-emmc.dts"
          
          # 修正内核 Makefile
          sed -i '/mt7981b-sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
          echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
          
          echo "📦 打包中..."
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make target/install -j$(nproc)

      - name: 9. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Final-Image
          path: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
