name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 [极致补全] 环境物理自愈"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "📂 Clone ImmortalWrt (24.10)"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: "⚡ [核心完整] 物理缓存机制"
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('openwrt/include/toplevel.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-

      - name: Update Feeds
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a > /dev/null 2>&1

      - name: Run patch script
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make defconfig FORCE=1
          make tools/install -j$(nproc) FORCE=1 || make tools/install -j1 V=s FORCE=1
          make toolchain/install -j$(nproc) FORCE=1 || make toolchain/install -j1 V=s FORCE=1

      - name: Build Firmware
        working-directory: ./openwrt
        run: |
          # 🔥 [物理清算] 彻底抹除旧产物
          rm -rf bin/targets/mediatek/filogic/*
          
          # 🔥 [物理固化] 确保 24.10 接受脚本注入的 1024MB 空间定义
          make defconfig FORCE=1
          
          # 🔥 [物理强制] 强制内核重编，应用自定义 DTS 指纹
          make target/linux/clean FORCE=1
          
          # 🔥 [物理全流程] 24.10 必须完整执行以生成 metadata.json，否则无法刷机
          make -j$(nproc) FORCE=1 || make -j1 V=s FORCE=1
          
          # 物理检查：备份生成的最终配置
          cp .config bin/targets/mediatek/filogic/3000-emmc.config || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SL3000-Firmware
          path: openwrt/bin/targets/mediatek/filogic/

      - name: "🚢 [延续] 自动发布固件"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-v24.10-${{ github.run_id }}
          files: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.config
