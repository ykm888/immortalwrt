name: Build_SL3000_Physical_Locked

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /var/lib/docker /usr/local/share/powershell /usr/lib/jvm || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file tar bzip2 patch setserial \
            pkg-config qemu-utils libelf-dev python3-setuptools
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: Clone and Update
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Apply Physical Patch
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: Build with Dual-Injection
        working-directory: ./openwrt
        run: |
          # 物理死锁：清除索引并二次强灌
          rm -rf tmp
          cp -fv .config.locked .config
          make defconfig
          cp -fv .config.locked .config
          
          # 强制物理重绘
          make target/linux/clean
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Final-Physical-Locked
          # 物理递归提取，搜寻并抓取隐藏在子文件夹的 fip.bin
          path: openwrt/bin/targets/mediatek/filogic/**
