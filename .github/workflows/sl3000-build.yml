name: SL3000-V13.3-Final-Fix

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 环境清理与磁盘扩容
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 克隆源码 (ImmortalWrt 24.10)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 开启隔离缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          # 核心修复：更新 key 版本号到 v13.3，彻底丢弃之前的 x86 错误缓存
          key: ${{ runner.os }}-openwrt-v13.3-${{ hashFiles('**/sl3000_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-v13.3-

      - name: 5. 执行注入脚本 (架构锁定)
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: 6. 编译 Host 工具与工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 延续 V13 修复：设置 Host 环境变量防止工具链找不到 bison/m4
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 7. 精确 DTS 注入 (修复 eth0 错误)
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          # 核心修复：将修改后的 DTS 注入到内核源码树
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            cp -fv "../custom_files/mt7981b-sl3000-emmc.dts" "$K_DTS_DIR/"
            # 兼容性同步：生成一个不带 b 的副本，防止 Makefile 找不到
            cp -fv "$K_DTS_DIR/mt7981b-sl3000-emmc.dts" "$K_DTS_DIR/mt7981-sl3000-emmc.dts"
            
            # 核心修复：在内核 Makefile 中注册新设备（防止跳过编译）
            sed -i '/sl3000-emmc.dtb/d' "$K_DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$K_DTS_DIR/Makefile"
          fi

      - name: 8. 执行正式编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          # 仅编译 SL3000 目标镜像
          make target/linux/compile -j$(nproc) V=s
          make target/install -j$(nproc) V=s

      - name: 9. 上传固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-1GB-V13.3-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
