name: SL3000_Total_Fix_Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境初始化与 12G Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc dos2unix
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          fi

      - name: 克隆源码与 Feeds
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 执行物理补丁 (scripts/sl3000-patch.sh)
        run: |
          dos2unix scripts/sl3000-patch.sh && chmod +x scripts/sl3000-patch.sh
          bash -x ./scripts/sl3000-patch.sh

      - name: 步骤 1：构建核心工具链
        working-directory: ./openwrt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TERM=xterm-256color
          yes "" | make defconfig
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 步骤 2：构建固件与全量引导
        working-directory: ./openwrt
        run: |
          (while true; do sleep 300; echo "--- [HEARTBEAT] Still Compiling... ---"; done) &
          export TERM=xterm-256color
          # 物理攻坚：内核优先并开启详细日志
          make target/linux/compile -j$(nproc) V=s
          # 全量合成 (包含 uboot 和 fip)
          make -j$(nproc) || make -j1 V=s

      - name: 产物物理收割 (含 Bootloader)
        run: |
          mkdir -p OUTPUT
          # 1. 拷贝 sysupgrade 固件
          find openwrt/bin/targets/mediatek/filogic/ -name "*sl3000*" -exec cp -v {} OUTPUT/ \;
          # 2. 物理提取核心引导程序 (FIP/U-Boot/ATF) 用于解决刷机失败
          find openwrt/bin/targets/mediatek/filogic/ -name "*fip*" -exec cp -v {} OUTPUT/ \; || true
          find openwrt/bin/targets/mediatek/filogic/ -name "*u-boot*" -exec cp -v {} OUTPUT/ \; || true
          find openwrt/bin/targets/mediatek/filogic/ -name "*bl31*" -exec cp -v {} OUTPUT/ \; || true
          # 3. 物理备份配置
          cp -v openwrt/.config OUTPUT/sl3000.config || true

      - name: 自动发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-FullBoot-${{ github.run_id }}
          files: OUTPUT/*
