name: Build ImmortalWrt for SL3000-eMMC

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo alphabetctl set-timezone "Asia/Shanghai"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        # 物理注入：改用 printf 规避 EOF
        TARGET_MK="target/linux/mediatek/image/filogic.mk"
        printf "\ndefine Device/sl3000-emmc\n" >> $TARGET_MK
        printf "  DEVICE_VENDOR := SL\n" >> $TARGET_MK
        printf "  DEVICE_MODEL := 3000-eMMC\n" >> $TARGET_MK
        printf "  DEVICE_DTS := mt7981b-3000-emmc\n" >> $TARGET_MK
        printf "  DEVICE_DTS_DIR := \$(DTS_DIR)/mediatek\n" >> $TARGET_MK
        printf "  SUPPORTED_DEVICES := sl,3000-emmc\n\n" >> $TARGET_MK
        printf "  # 物理死锁：字节纯数字，防止 dd 报错\n" >> $TARGET_MK
        printf "  KERNEL_SIZE := 134217728\n" >> $TARGET_MK
        printf "  IMAGE_SIZE := 536870912\n\n" >> $TARGET_MK
        printf "  KERNEL := kernel-bin | lzma | append-dtb\n" >> $TARGET_MK
        printf "  DEVICE_PACKAGES := kmod-mmc kmod-mtk-sd kmod-fs-f2fs f2fs-tools f2fsck \\\\\n" >> $TARGET_MK
        printf "                    parted lsblk blkid block-mount kmod-zram zram-swap \\\\\n" >> $TARGET_MK
        printf "                    luci-app-diskman uboot-envtools\n\n" >> $TARGET_MK
        printf "  # 物理修复：移除导致 Missing Build 报错的 ARTIFACTS 段落\n" >> $TARGET_MK
        printf "  # 镜像生成逻辑\n" >> $TARGET_MK
        printf "  IMAGES := sysupgrade.bin\n" >> $TARGET_MK
        printf "  IMAGE/sysupgrade.bin := append-kernel | pad-to 134217728 | append-rootfs | check-size | append-metadata\n" >> $TARGET_MK
        printf "endef\n" >> $TARGET_MK
        printf "TARGET_DEVICES += sl3000-emmc\n" >> $TARGET_MK

    - name: Physical Fix U-Boot Makefile
      run: |
        cd openwrt
        # 物理修复：针对 sed unterminated s command 报错点，添加闭合斜杠并定位行尾
        UBOOT_MK="package/boot/uboot-mediatek/Makefile"
        if [ -f "$UBOOT_MK" ]; then
          sed -i '/dtb- +=/ s/$/ mt7981-sl3000-emmc.dtb/' $UBOOT_MK
        fi

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_firmware
        path: openwrt/bin/targets/
