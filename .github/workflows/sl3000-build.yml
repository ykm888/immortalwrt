name: SL3000_Fixed_Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 专属环境初始化与 Swap 物理避让
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc dos2unix
          
          # 物理修复：检查 Swap 是否已激活，防止 "Text file busy" 报错
          if ! swapon --show | grep -q '/swapfile'; then
            if [ -f /swapfile ]; then sudo swapoff /swapfile || true; fi
            sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

      - name: 克隆源码 (24.10)
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 更新 Feeds
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 执行物理补丁 (脚本：scripts/sl3000-patch.sh)
        run: |
          dos2unix scripts/sl3000-patch.sh || true
          chmod +x scripts/sl3000-patch.sh
          bash -x ./scripts/sl3000-patch.sh

      - name: 构建全链路 (物理心跳自愈模式)
        working-directory: ./openwrt
        run: |
          # 1. 物理心跳：防止网页假死导致任务超时
          (while true; do sleep 600; echo "--- [HEARTBEAT] $(date) | Runner is Alive | CPU: $(nproc) ---"; done) &
          
          # 2. 物理重置配置 (针对 24.10 优化)
          export DEBIAN_FRONTEND=noninteractive
          rm -f .config*
          bash -x ../scripts/sl3000-patch.sh
          yes "" | make defconfig
          
          # 3. 稳健编译
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # 物理二次对齐 DTS
          bash -x ../scripts/sl3000-patch.sh
          
          make -j$(nproc) || make -j1 V=s

      - name: 产物物理收割
        run: |
          mkdir -p OUTPUT
          find openwrt/bin/targets/mediatek/filogic/ -name "*sl3000*" -exec cp -v {} OUTPUT/ \;
          sudo find openwrt/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*atf*" \) -exec cp -v {} OUTPUT/ \; || true
          cp -v openwrt/.config OUTPUT/sl3000.config || true

      - name: 自动发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-v24.10-${{ github.run_id }}
          files: OUTPUT/*
