name: SL3000-V13.2-Final-Build

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 环境清理与磁盘扩容
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. 克隆源码
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 开启编译缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          # key 加入 v13.2 后缀，确保能清理掉之前错误的 x86 缓存残留
          key: ${{ runner.os }}-openwrt-v13.2-${{ hashFiles('**/sl3000_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-v13.2-

      - name: 5. 执行注入脚本
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: 6. 编译 Host 工具
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 7. 动态 DTS 注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          # 寻找内核 DTS 目录并智能处理 mt7981/mt7981b 的差异
          K_DTS_DIRS=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d)
          for DTS_DIR in $K_DTS_DIRS; do
            if [ -f "$DTS_DIR/mt7981b.dtsi" ]; then DTSI_FILE="mt7981b.dtsi"; else DTSI_FILE="mt7981.dtsi"; fi
            sed "s/mt7981.*\.dtsi/$DTSI_FILE/g" "custom_files/mt7981b-sl3000-emmc.dts" > "$DTS_DIR/mt7981b-sl3000-emmc.dts"
            cp -f "$DTS_DIR/mt7981b-sl3000-emmc.dts" "$DTS_DIR/mt7981-sl3000-emmc.dts"
            # 注册到内核 Makefile
            sed -i '/sl3000-emmc.dtb/d' "$DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981-sl3000-emmc.dtb' >> "$DTS_DIR/Makefile"
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$DTS_DIR/Makefile"
          done

      - name: 8. 执行编译
        working-directory: ${{ env.WORKDIR }}
        run: |
          export BISON_PKGDATADIR=/usr/share/bison
          export M4=/usr/bin/m4
          export PATH=/usr/bin:${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make target/linux/compile -j$(nproc) V=s
          make target/install -j$(nproc) V=s

      - name: 9. 上传发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-eMMC-V13.2-${{ github.run_id }}
          files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc-sysupgrade.bin
          token: ${{ secrets.GITHUB_TOKEN }}
