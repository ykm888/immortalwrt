name: SL-3000-AutoBuild

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: custom-config/sl3000.config
  DIY_SH: scripts/sl3000-patch.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y $(curl -fsSL https://raw.githubusercontent.com/p3terx/Actions-OpenWrt/main/debian-setup)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Physical Patch & Update Feeds
      run: |
        cd openwrt
        # 物理复制整合脚本
        cp ../$DIY_SH ./patch.sh
        chmod +x patch.sh
        # [物理触发 1]：注入源、创建目录、注入 DTS/MK
        ./patch.sh 
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & Final Physical Audit
      run: |
        # 物理加载自定义 .config
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        # [物理触发 2]：在生成最终配置前，再次运行脚本确保 DTS 文件和 .config 开关被锁定
        ./patch.sh
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        # 物理执行构建，增加物理检查，确保编译报错能立刻熔断
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Firmware-Package
        path: |
          openwrt/bin/targets/mediatek/filogic/*.bin
          openwrt/bin/targets/mediatek/filogic/*.tar.gz
