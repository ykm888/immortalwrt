name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. ✅ [延续设置] 12G Swap 物理挂载"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "3. 克隆源码"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "4. 🔥 [物理隔离] 恢复全量工具链缓存"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
            ${{ env.WORKDIR }}/build_dir/toolchain-*
          key: ${{ runner.os }}-sl3000-chain-v30-final
          restore-keys: |
            ${{ runner.os }}-sl3000-chain-

      - name: "5. 运行补丁脚本 (内含 binutils 和 Bison 修复)"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: "6. 🔥 [核心对齐] 物理锁定 Bison 环境变量"
        run: |
          # 针对 bison: m4sugar.m4: No such file or directory 报错的物理修复
          B_DATA=$(pkg-config --variable=pkgdatadir bison 2>/dev/null || echo '/usr/share/bison')
          echo "BISON_PKGDATADIR=$B_DATA" >> $GITHUB_ENV
          echo "M4=$(which m4)" >> $GITHUB_ENV

      - name: "7. 🔥 [物理焊死] 注入 DTS 到内核源码树 (解决编译报错)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 必须先 prepare，使 build_dir 下产生解压后的内核源码
          make target/linux/prepare -j$(nproc)
          DTS_FILE="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          # 深度物理强灌：直接将 DTS 注入 build_dir 里的内核源码树
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            echo "💉 注入 DTS 到内核源码: $dts_path"
            cp -fv "$DTS_FILE" "$dts_path/"
            # 在内核对应的 Makefile 中注册 dtb
            grep -q "mt7981b-sl3000-emmc.dtb" "$dts_path/Makefile" || echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$dts_path/Makefile"
          done

      - name: "8. ✅ [物理归位] 编译内核与合成 (环境变量加持)"
        working-directory: ${{ env.WORKDIR }}
        env:
          BISON_PKGDATADIR: ${{ env.BISON_PKGDATADIR }}
          M4: ${{ env.M4 }}
        run: |
          # 加上环境变量传递，确保内核编译阶段 bison 不会报错
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y || true

      - name: "9. 🔥 [精准打捞] 暴力全盘搜索固件"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          find bin/targets build_dir -type f -size +10M -name "*sysupgrade.bin" -not -path "*/staging_dir/*" -exec cp -v {} ../release_bins/ \; 2>/dev/null || true
          find bin/targets -name "*.manifest" -exec cp -v {} ../release_bins/ \; 2>/dev/null || true
          ls -lh ../release_bins/

      - name: "10. 发布最终 Release"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-v4.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "11. 🛡️ [物理封印] 失败也强制保存全量缓存"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
            ${{ env.WORKDIR }}/build_dir/toolchain-*
          key: ${{ runner.os }}-sl3000-chain-v30-final
