name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. ✅ [延续设置] 12G Swap 物理挂载与系统清理"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "3. 克隆源码"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "4. 🔥 [物理隔离] 恢复全量工具链缓存"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
            ${{ env.WORKDIR }}/build_dir/toolchain-*
          key: ${{ runner.os }}-sl3000-chain-v120-absolute
          restore-keys: |
            ${{ runner.os }}-sl3000-chain-

      - name: "5. 运行补丁脚本 (内含 binutils/dtc/Bison 全量物理修复)"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: "6. 🔥 [核心归位] 锁定 PATH 优先级与环境变量"
        run: |
          # 💡 [修正] 之前 rm 命令误删了脚本建立的软链接，导致 flex 找不到 m4
          # 软链接 (ln -sf) 已经覆盖了缓存毒瘤，此处只需锁定环境变量
          B_DATA=$(pkg-config --variable=pkgdatadir bison 2>/dev/null || echo '/usr/share/bison')
          echo "BISON_PKGDATADIR=$B_DATA" >> $GITHUB_ENV
          echo "M4=$(which m4)" >> $GITHUB_ENV
          # 💡 [关键补全] 强制 PATH 顺序，确保系统优先使用宿主机工具
          echo "PATH=/usr/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV

      - name: "7. 🔥 [物理焊死] 注入 DTS 并物理注册内核 Makefile"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 必须执行 prepare，否则 build_dir 里的内核源码还没展开
          make target/linux/prepare -j$(nproc)
          DTS_FILE="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          # 深度物理强灌：无论内核怎么解压，全部塞进去并写死编译目标
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            echo "💉 物理注入 DTS 到源码: $dts_path"
            cp -fv "$DTS_FILE" "$dts_path/"
            if ! grep -q "mt7981b-sl3000-emmc.dtb" "$dts_path/Makefile"; then
              echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$dts_path/Makefile"
            fi
          done

      - name: "8. ✅ [物理归位] 全量编译 (显式传递双重环境锁)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 显式传递所有物理锁定的环境变量与路径
          export PATH=${{ env.PATH }}
          export BISON_PKGDATADIR=${{ env.BISON_PKGDATADIR }}
          export M4=${{ env.M4 }}
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: "9. 🔥 [物理打捞] 暴力搜索固件"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          find bin/targets -type f -size +10M -name "*sysupgrade.bin" -exec cp -v {} ../release_bins/ \; 2>/dev/null || true
          ls -lh ../release_bins/

      - name: "10. 发布最终 Release"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-v4.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "11. 🛡️ [物理封印] 强制保存缓存"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
            ${{ env.WORKDIR }}/build_dir/toolchain-*
          key: ${{ runner.os }}-sl3000-chain-v120-absolute
