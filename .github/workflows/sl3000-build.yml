name: SL3000_Full_Stack_Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 体系延续：12GB Swap 与深度空间清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc dos2unix
          
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

      - name: 克隆源码 (锁定 24.10 分支)
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 更新 Feeds
        working-directory: ./openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 执行物理补丁 (自愈脚本调用)
        run: |
          dos2unix scripts/sl3000-patch.sh || true
          chmod +x scripts/sl3000-patch.sh
          # 物理输出：开启全量日记
          bash -x ./scripts/sl3000-patch.sh

      - name: 构建核心工具链
        working-directory: ./openwrt
        run: |
          # 物理对齐：使用初始名称 config.locked
          cp -fv .config.locked .config
          yes "" | make defconfig
          make download -j8
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          # 🔥 物理二次注入（保持原始脚本名）
          make target/linux/prepare -j$(nproc)
          bash -x ../scripts/sl3000-patch.sh

      - name: 编译全链路 (全链路自愈物理强灌)
        working-directory: ./openwrt
        run: |
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          # 物理同步：强制执行一次 olddefconfig 锁定配置
          yes "" | make olddefconfig || true
          make -j$(nproc) || make -j1 V=s

      - name: 产物物理搜索提取
        run: |
          mkdir -p OUTPUT
          find openwrt/bin/targets/mediatek/filogic/ -name "*sl3000-emmc*" -exec cp -v {} OUTPUT/ \;
          # 物理深度收割 FIP 和 U-Boot
          sudo find openwrt/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*bl31*" -o -name "*atf*" \) -exec cp -v {} OUTPUT/ \; || true

      - name: 自动发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-v24.10-${{ github.run_id }}
          files: OUTPUT/*
