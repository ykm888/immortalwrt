name: Build_SL3000
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk libncurses-dev libssl-dev python3 git

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Copy device files
        run: |
          mkdir -p openwrt/target/linux/mediatek/dts
          mkdir -p openwrt/target/linux/mediatek/image
          cp custom-config/mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/
          cp custom-config/filogic.mk openwrt/target/linux/mediatek/image/

      - name: Run patch script
        run: |
          chmod +x scripts/sl3000-patch.sh
          cd openwrt
          ../scripts/sl3000-patch.sh

      - name: Create .config
        working-directory: ./openwrt
        run: |
          : > .config
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config

      - name: Defconfig
        working-directory: ./openwrt
        run: make defconfig

      - name: Download
        working-directory: ./openwrt
        run: make download -j4

      - name: Build
        working-directory: ./openwrt
        run: make -j1 V=s
        continue-on-error: true  # 编译失败也不中断流程，继续输出排查日志

      - name: 精准排查固件未生成原因（核心新增步骤）
        working-directory: ./openwrt
        run: |
          echo "======================================"
          echo "开始排查固件未生成原因："
          echo "======================================"
          
          # 1. 检查编译是否报错（打印最后100行编译日志）
          echo -e "\n1. 编译日志末尾（查看是否有报错）："
          tail -n 100 build_dir/target-aarch64_cortex-a53_musl/compile.log 2>/dev/null || echo "编译日志文件不存在，可能未开始编译"
          
          # 2. 检查目标设备是否被识别（确认设备配置正确）
          echo -e "\n2. 已识别的设备列表（确认sl3000-emmc是否在列）："
          find target/linux/mediatek/image/ -name "*.mk" -exec grep -l "sl3000-emmc" {} \; 2>/dev/null || echo "未找到sl3000-emmc设备配置，可能MK文件注入失败"
          
          # 3. 检查DTS文件是否存在且语法正确
          echo -e "\n3. DTS文件状态（确认设备树是否正常）："
          if [ -f target/linux/mediatek/dts/mt7981b-sl3000-emmc.dts ]; then
            echo "DTS文件存在，开始检查语法..."
            dtc -I dts -O dtb -o /tmp/test.dtb target/linux/mediatek/dts/mt7981b-sl3000-emmc.dts 2>&1 || echo "DTS文件语法错误！"
          else
            echo "DTS文件不存在，注入失败！"
          fi
          
          # 4. 检查固件输出目录（查看是否有部分生成的文件）
          echo -e "\n4. 固件输出目录内容（查看是否有半成品固件）："
          ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || echo "固件输出目录不存在，编译未执行到生成阶段"
          
          # 5. 检查.config配置是否正确（确认目标设备未被覆盖）
          echo -e "\n5. .config中的目标设备配置（确认是否正确）："
          grep "CONFIG_TARGET_mediatek_filogic_DEVICE" .config || echo ".config中未找到设备配置，可能配置被覆盖"
          
          echo "======================================"
          echo "排查结束"
          echo "======================================"

      - name: 显示固件（最终验证）
        working-directory: ./openwrt
        run: |
          echo -e "\n最终固件输出目录："
          ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || echo "未生成任何固件文件"

      - name: 上传固件（生成则上传）
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/targets/mediatek/filogic/*
