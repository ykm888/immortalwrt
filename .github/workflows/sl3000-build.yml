name: SL3000-1GB-Final-Build

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出本地配置
        uses: actions/checkout@v4

      - name: 2. 安装环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc dos2unix libncurses5-dev libssl-dev

      - name: 3. 克隆源码
        run: git clone --depth=1 -b ${{ env.SOURCE_BRANCH }} ${{ env.SOURCE_REPO }} ${{ env.WORKDIR }}

      - name: 4. 执行注入补丁
        working-directory: ${{ env.WORKDIR }}
        run: |
          chmod +x ../scripts/sl3000-patch.sh
          ../scripts/sl3000-patch.sh

      - name: 5. 构建工具与编译器
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 6. 核心：内核初始化 (修复 gpio-button 报错)
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          # 这一步产生 .config 环境，让后续插件编译能找到依赖
          make target/linux/compile -j$(nproc)

      - name: 7. 编译插件与打包镜像
        working-directory: ${{ env.WORKDIR }}
        run: |
          export PATH=${{ github.workspace }}/${{ env.WORKDIR }}/staging_dir/host/bin:$PATH
          # 编译所有软件包
          make package/compile -j$(nproc) || make package/compile -j1 V=s
          
          # 确保 DTS 在最终打包前不被重置 (回马枪)
          K_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          cp -fv target/linux/mediatek/dts/mt7981b-sl3000-emmc.dts "$K_DIR/"
          
          # 执行打包
          make target/linux/install -j$(nproc) || make target/linux/install -j1 V=s
          make target/install -j$(nproc)

      - name: 8. 上传 1GB 专属固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1GB-Edition
          path: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
