name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. ✅ [延续设置] 12G Swap 物理挂载"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "3. 克隆源码"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "4. 🔥 [物理隔离] 全量工具链缓存恢复"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
            ${{ env.WORKDIR }}/build_dir/toolchain-*
          key: ${{ runner.os }}-sl3000-full-chain-v23-final
          restore-keys: |
            ${{ runner.os }}-sl3000-full-chain-

      - name: "5. 运行补丁脚本 (内含 binutils 核心修复)"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: "6. ✅ [提速逻辑] 命中则跳过编译"
        working-directory: ${{ env.WORKDIR }}
        run: |
          if [ -d "staging_dir/host/bin" ] && [ -x "staging_dir/host/bin/bison" ]; then
            echo "✅ 工具链已从缓存恢复，直接合成固件"
          else
            echo "⚠️ 缓存未命中，执行全量编译（已注入 binutils 物理修复）"
            make tools/install -j$(nproc)
            make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          fi

      - name: "7. ✅ [延续设置] DTS 注入与内核注册"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          DTS_SRC="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv "$DTS_SRC" "$dts_path/"
            MAKEFILE="$dts_path/Makefile"
            [ -f "$MAKEFILE" ] && (grep -q "mt7981b-sl3000-emmc.dtb" "$MAKEFILE" || echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$MAKEFILE")
          done

      - name: "8. ✅ [物理归位] 核心编译与 Error 127 容错"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/compile -j$(nproc)
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y || true

      - name: "9. 🔥 [物理打捞] 暴力全盘搜索固件 (杜绝丢失)"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          find bin/targets build_dir -type f -size +10M -name "*sysupgrade.bin" -not -path "*/staging_dir/*" -exec cp -v {} ../release_bins/ \; 2>/dev/null || true
          find bin/targets -name "*.manifest" -exec cp -v {} ../release_bins/ \; 2>/dev/null || true
          ls -lh ../release_bins/

      - name: "10. 发布最终固件"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-v4.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "11. 🛡️ [物理封印] 失败也强制保存全量缓存"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
            ${{ env.WORKDIR }}/build_dir/toolchain-*
          key: ${{ runner.os }}-sl3000-full-chain-v23-final
