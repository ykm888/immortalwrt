name: SL3000-Extreme-Build

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. 延续设置：磁盘清理与 12G Swap"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "3. 安装依赖环境"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "4. 克隆源码 (v24.10)"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "5. 延续设置：分体式缓存恢复"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-sl3000-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sl3000-v2-

      - name: "6. 运行全量补丁脚本"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: "7. 构建工具链"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: "8. 延续设置：DTS 物理注入"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv ../custom-config/mt7981b-sl3000-emmc.dts "$dts_path/"
          done

      - name: "9. 强力编译 (含 Error 127 容错)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/compile -j$(nproc)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y || true

      - name: "10. 延续设置：固件全盘地毯式搜索"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          find . -name "*sysupgrade.bin" -o -name "*.manifest" | while read -r file; do
            cp -v "$file" ../release_bins/
          done

      - name: "11. 发布最终固件"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-v3.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "12. 强制保存缓存 (无论成败)"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-sl3000-v2-${{ github.run_id }}
