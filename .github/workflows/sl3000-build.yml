name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. ✅ [延续历史设置] 12G 大容量 Swap 与环境清理"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "3. 克隆源码 (v24.10)"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "4. ✅ [延续历史设置] 强制冷启动 (V4-Clean 缓存隔离)"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          # 严格沿用 v4-clean 逻辑，确保环境隔离 [cite: 2026-02-09]
          key: ${{ runner.os }}-sl3000-v4-clean-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sl3000-v4-clean-

      - name: "5. ✅ [延续历史设置] 运行补丁脚本 (128M/1024M/1G RAM)"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: "6. 构建工具链"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: "7. ✅ [延续历史设置] DTS 物理注入与内核注册"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          DTS_SRC="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          # 物理修复：确保内核编译器识别 sl3000 设备 [cite: 2026-02-09]
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv "$DTS_SRC" "$dts_path/"
            MAKEFILE="$dts_path/Makefile"
            [ -f "$MAKEFILE" ] && (grep -q "mt7981b-sl3000-emmc.dtb" "$MAKEFILE" || echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$MAKEFILE")
          done

      - name: "8. ✅ [物理修复] 编译合成 (修复 root-mediatek 缺失与 Error 127 容错)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 1. 物理修复：先填充 rootfs 目录防止 mksquashfs 报错 [cite: 2026-02-09]
          make target/linux/compile -j$(nproc)
          make package/install -j$(nproc) || make package/install -j1 V=s
          
          # 2. ✅ [延续历史设置] 含 Error 127 容错的三段式安装逻辑 [cite: 2026-02-08]
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y || true

      - name: "9. ✅ [延续历史设置] 精准固件打捞 (诊断排除版)"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          echo "🔍 正在提取固件..."
          # 严格过滤：屏蔽 staging_dir，只搜寻 >10MB 固件 [cite: 2026-02-09]
          SEARCH_PATHS=""
          [ -d "bin/targets" ] && SEARCH_PATHS="$SEARCH_PATHS bin/targets"
          [ -d "build_dir" ] && SEARCH_PATHS="$SEARCH_PATHS build_dir"
          
          if [ -n "$SEARCH_PATHS" ]; then
            find $SEARCH_PATHS -type f -size +10M -name "*sysupgrade.bin" -not -path "*/staging_dir/*" 2>/dev/null | while read -r img; do
              echo "📦 发现真实固件: $img"
              gzip -9 -c "$img" > "../release_bins/$(basename "$img").gz"
            done
            find $SEARCH_PATHS -type f -name "*.manifest" -not -path "*/staging_dir/*" 2>/dev/null -exec cp -v {} ../release_bins/ \;
          fi
          
          # ✅ [延续历史设置] 防止发布任务因目录为空而报错
          [ -z "$(ls -A ../release_bins)" ] && echo "no_firmware_found" > ../release_bins/readme.txt
          ls -lh ../release_bins/

      - name: "10. 发布最终固件"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-v4.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "11. ✅ [延续历史设置] 强制保存缓存 (无论成败)"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-sl3000-v4-clean-${{ github.run_id }}
