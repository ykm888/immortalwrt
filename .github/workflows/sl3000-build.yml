name: SL3000-Final-Build

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler libncurses5-dev libssl-dev

      - name: 3. 克隆源码
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: 4. 恢复缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-sl3000-final-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-sl3000-final-

      - name: 5. 运行补丁脚本
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: 6. 编译工具链
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 7. DTS 物理注入
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          K_DTS_DIR=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | head -n 1)
          if [ -n "$K_DTS_DIR" ]; then
            cp -fv ../custom-config/mt7981b-sl3000-emmc.dts "$K_DTS_DIR/"
          fi

      - name: 8. 最终极限封包 (🎯 解决 opkg 找不到问题)
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 建立工具链 bin 目录
          HOST_BIN="$(pwd)/staging_dir/host/bin"
          mkdir -p "$HOST_BIN"
          
          # 🎯 物理解决 Error 127: 复制系统 opkg 到 staging_dir 
          [ ! -f "$HOST_BIN/opkg" ] && cp -fv "$(which opkg)" "$HOST_BIN/opkg" || true
          [ ! -f "$HOST_BIN/mkhash" ] && cp -fv "$(which mkhash)" "$HOST_BIN/mkhash" || true
          
          # 确保全局可调用
          export PATH="$HOST_BIN:$PATH"
          
          # 执行编译
          make target/linux/compile -j$(nproc)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || \
          make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y

      - name: 9. 发布产物
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-v1.0-${{ github.run_id }}
          files: |
            ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.bin
            ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*.manifest
          token: ${{ secrets.GITHUB_TOKEN }}
