name: SL3000_Ultimate_One_Shot_Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 物理环境初始化 (16G Swap 物理重置)
        run: |
          # 物理解决 Text file busy：强制关闭并删除现有交换文件
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo apt update && sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc dos2unix
          
          # 物理重新分配
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 克隆源码 (24.10)
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 执行物理补丁 (脚本对齐)
        run: |
          dos2unix scripts/sl3000-patch.sh && chmod +x scripts/sl3000-patch.sh
          bash -x ./scripts/sl3000-patch.sh

      - name: 步骤 1：构建工具链与 U-Boot 物理隔离编译
        working-directory: ./openwrt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          yes "" | make defconfig
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          # 🔥 物理隔离：只编译指定的 MT7981 变体，彻底绕过 MIPS 架构报错
          make package/boot/uboot-mediatek/mt7981_sl3000-emmc/compile V=s

      - name: 步骤 2：生成系统固件
        working-directory: ./openwrt
        run: |
          (while true; do sleep 300; echo "--- [HEARTBEAT] Still Building ---"; done) &
          make -j$(nproc) || make -j1 V=s

      - name: 产物物理收割 (硬核提取)
        run: |
          mkdir -p OUTPUT
          # 提取系统固件
          find openwrt/bin/targets/mediatek/filogic/ -name "*sl3000*" -exec cp -v {} OUTPUT/ \;
          
          # 物理提取引导程序 (FIP)
          find openwrt/bin/targets/mediatek/filogic/ -name "*.bin" | grep -iE "fip|u-boot" -exec cp -v {} OUTPUT/ \; || true
          
          # 兜底截获
          if [ $(ls OUTPUT/ | grep -iE "fip|u-boot" | wc -l) -eq 0 ]; then
            find openwrt/build_dir/ -name "*fip.bin" -exec cp -v {} OUTPUT/ \; || true
            find openwrt/build_dir/ -name "*u-boot.bin" -exec cp -v {} OUTPUT/ \; || true
          fi
          
          cp -v openwrt/.config OUTPUT/sl3000.config

      - name: 自动发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Final-${{ github.run_id }}
          files: OUTPUT/*
