name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. 环境准备：12G Swap 与磁盘清理"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "3. 克隆源码与同步补丁"
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: "4. 构建工具链 (核心依赖)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: "5. DTS 物理注入与 Makefile 注册"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          DTS_SRC="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          # 物理修复：注入并强制注册，确保内核编译器不跳过它 [cite: 2026-02-09]
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv "$DTS_SRC" "$dts_path/"
            MAKEFILE="$dts_path/Makefile"
            [ -f "$MAKEFILE" ] && (grep -q "mt7981b-sl3000-emmc.dtb" "$MAKEFILE" || echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$MAKEFILE")
          done

      - name: "6. 终极全量编译 (彻底解决 No such file 报错)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          # 1. 先进行内核编译
          make target/linux/compile -j$(nproc)
          # 2. 关键：先执行默认包安装，生成 rootfs 目录结构 [cite: 2026-02-09]
          make package/install -j$(nproc) || make package/install -j1 V=s
          # 3. 生成最终镜像，去掉 || true 暴露真实错误
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y V=s

      - name: "7. 精准打捞：暴力清除非固件碎屑"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          echo "🔍 启动高精度固件搜索..."
          # 仅在 bin 目录下寻找真正生成的 .bin 固件 [cite: 2026-02-09]
          if [ -d "bin/targets" ]; then
            find bin/targets -type f -name "*sysupgrade.bin" | while read -r img; do
              echo "📦 命中真实固件: $img"
              gzip -9 -c "$img" > "../release_bins/$(basename "$img").gz"
            done
            find bin/targets -type f -name "*.manifest" -exec cp -v {} ../release_bins/ \;
          fi
          
          # 诊断：如果 Release 目录依然为空，列出所有 10MB 以上文件
          if [ -z "$(ls -A ../release_bins)" ]; then
            echo "❌ 警告：未发现固件！全盘扫描大文件定位原因："
            find . -type f -size +10M -not -path "*/.git/*" -not -path "*/staging_dir/*"
            echo "build_failed_check_step6_logs" > ../release_bins/FAILURE_LOG.txt
          fi

      - name: "8. 发布固件"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Extreme-v4.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}
