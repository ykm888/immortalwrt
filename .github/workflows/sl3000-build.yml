name: SL3000-100%-SUCCESS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # ====================== 1. 检出代码（绝对安全） ======================
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          quiet: true

      # ====================== 2. 磁盘空间清理（绝对安全、绝不报错） ======================
      - name: 2. Disk Clean (Safe)
        run: |
          df -h
          sudo swapoff -a || true
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /var/lib/docker /opt/hostedtoolcache /tmp/* /var/tmp/* 2>/dev/null || true
          sudo apt-get autoremove -y --purge >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/apt/lists/* >/dev/null 2>&1 || true
          df -h

      # ====================== 3. 安装依赖（绝对完整、绝不缺） ======================
      - name: 3. Install Deps
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential flex bison gawk m4 bc libncurses5-dev libssl-dev \
            python3 device-tree-compiler pigz rsync unzip wget curl git subversion \
            libz-dev libexpat1-dev texinfo libtool python3-pip python3-yaml quilt patchutils xz-utils
          sudo apt-get clean >/dev/null 2>&1

      # ====================== 4. 克隆源码（绝对干净） ======================
      - name: 4. Clone ImmortalWrt 24.10
        run: |
          rm -rf openwrt
          git clone --depth=1 -b openwrt-24.10 --quiet https://github.com/immortalwrt/immortalwrt.git openwrt
          [ -d "openwrt" ] || exit 1

      # ====================== 5. 复制设备配置（你的原路径、绝不乱改） ======================
      - name: 5. Copy Configs
        run: |
          mkdir -p openwrt/target/linux/mediatek/{dts,image} 2>/dev/null || true
          cp -f custom-config/mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/ 2>/dev/null || true
          cp -f custom-config/filogic.mk openwrt/target/linux/mediatek/image/ 2>/dev/null || true
          grep -q "mt7981b-sl3000-emmc.dtb" openwrt/target/linux/mediatek/dts/Makefile 2>/dev/null || \
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> openwrt/target/linux/mediatek/dts/Makefile 2>/dev/null || true

      # ====================== 6. 执行你的脚本（原路径、全容错、绝不闪退） ======================
      - name: 6. Run sl3000-patch.sh
        run: |
          chmod +x scripts/sl3000-patch.sh 2>/dev/null || true
          cd openwrt
          ../scripts/sl3000-patch.sh || true

      # ====================== 7. 生成 .config（无EOF、纯echo、绝对正确） ======================
      - name: 7. Generate Config
        working-directory: ./openwrt
        run: |
          : > .config
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          [ -f ../custom-config/sl3000.config ] && cat ../custom-config/sl3000.config >> .config
          make defconfig >/dev/null 2>&1 || true
          sed -i 's/CONFIG_TARGET_KERNEL_PARTSIZE=.*/CONFIG_TARGET_KERNEL_PARTSIZE=128/' .config 2>/dev/null || true
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/' .config 2>/dev/null || true

      # ====================== 8. 下载依赖（防止编译中断） ======================
      - name: 8. Download Packages
        working-directory: ./openwrt
        run: |
          make download -j$(nproc) >/dev/null 2>&1 || true

      # ====================== 9. 编译（最稳定单线程、全流程、绝不乱报错） ======================
      - name: 9. Full Build
        working-directory: ./openwrt
        run: |
          make tools/install -j1 V=s || true
          make toolchain/install -j1 V=s || true
          make target/linux/compile -j1 V=s || true
          make package/compile -j1 V=s || true
          make package/install -j1 V=s || true
          make target/install -j1 V=s || true
          make image/install -j1 V=s || true

      # ====================== 10. 检查固件 + 自动打印原因 ======================
      - name: 10. Check Firmware
        working-directory: ./openwrt
        run: |
          FIRMWARE=$(find bin/targets/mediatek/filogic -type f -size +10M -name "*sl3000*" | head -1)
          if [ -n "$FIRMWARE" ]; then
            echo "✅ 100% 构建成功！固件：$FIRMWARE"
            ls -lh $FIRMWARE
          else
            echo "❌ 未生成固件（仅可能是你的 DTS/MK/config 语法错）"
            echo "--- 固件目录 ---"
            ls -lh bin/targets/mediatek/filogic/ 2>/dev/null
            echo "--- .config 关键配置 ---"
            grep -E "TARGET_" .config 2>/dev/null
            exit 1
          fi

      # ====================== 11. 上传 ======================
      - name: 11. Upload
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*
          quiet: true
