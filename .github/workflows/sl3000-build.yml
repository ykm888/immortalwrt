name: SL3000_FIP_TOTAL_REPAIR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 物理环境初始化
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt update && sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-pyelftools rsync unzip \
            zlib1g-dev swig device-tree-compiler wget file tar bzip2 patch bc dos2unix
          sudo fallocate -l 16G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: 克隆源码 (24.10)
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 执行物理修复补丁 (架构隔离)
        run: |
          dos2unix scripts/sl3000-patch.sh && chmod +x scripts/sl3000-patch.sh
          bash -x ./scripts/sl3000-patch.sh

      - name: 物理补全依赖链 (修复 libdeflate 报错)
        working-directory: ./openwrt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          make defconfig
          # 物理锁定：必须先安装 tools 和 toolchain，否则无法解压源码
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 核心构建 (生成 U-Boot/FIP)
        working-directory: ./openwrt
        run: |
          # 此时物理工具链已就绪，不再报错 No such file or directory
          make package/boot/uboot-mediatek/compile V=s -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: 🚀 物理死锁：强力打捞 FIP
        run: |
          mkdir -p OUTPUT
          # 策略 A：打捞 bin 目录
          find openwrt/bin/targets/mediatek/filogic/ -type f \( -name "*fip*" -o -name "*u-boot*" -o -name "*bl2*" -o -name "*sl3000*" \) -exec cp -v {} OUTPUT/ \; || true
          
          # 策略 B：物理现场截获 (build_dir)
          # 如果策略 A 漏掉，直接从编译生成的物理遗址抓取
          echo "Deep scanning build_dir for raw FIP..."
          find openwrt/build_dir/ -name "*mt7981_sl3000*fip.bin" -exec cp -v {} OUTPUT/ \; || true
          find openwrt/build_dir/ -name "*mt7981_sl3000*u-boot.bin" -exec cp -v {} OUTPUT/ \; || true
          
          cp -v openwrt/.config OUTPUT/sl3000.config

      - name: 自动发布
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-FIXED-FIP-${{ github.run_id }}
          files: OUTPUT/*
