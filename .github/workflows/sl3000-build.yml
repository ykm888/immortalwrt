name: SL3000-Extreme-Final

on:
  workflow_dispatch:

env:
  WORKDIR: openwrt
  DEVICE_NAME: sl3000-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "1. 检出代码"
        uses: actions/checkout@v4

      - name: "2. 延续设置：磁盘清理与 12G Swap"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /var/lib/docker /usr/local/lib/android || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile

      - name: "3. 安装依赖环境"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison m4 gawk rsync unzip wget python3 device-tree-compiler bc libncurses5-dev libssl-dev

      - name: "4. 克隆源码 (v24.10)"
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.WORKDIR }}

      - name: "5. 延续设置：分体式缓存恢复"
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-sl3000-v3-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sl3000-v2-

      - name: "6. 运行全量补丁脚本"
        run: chmod +x scripts/sl3000-patch.sh && ./scripts/sl3000-patch.sh

      - name: "7. 构建工具链"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: "8. 延续设置：DTS 物理注入 (路径修复)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/prepare -j$(nproc)
          # 使用 workspace 绝对路径，解决 cp: cannot stat 报错
          DTS_SRC="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv "$DTS_SRC" "$dts_path/"
          done

      - name: "9. 强力编译 (含 Error 127 容错)"
        working-directory: ${{ env.WORKDIR }}
        run: |
          make target/linux/compile -j$(nproc)
          make target/linux/install -j$(nproc) DEVICE_${{ env.DEVICE_NAME }}=y || make target/linux/install -j1 V=s DEVICE_${{ env.DEVICE_NAME }}=y || true

      - name: "10. 延续设置：深度打捞与压缩 (容错修复)"
        working-directory: ${{ env.WORKDIR }}
        if: always()
        run: |
          mkdir -p ../release_bins
          echo "🔍 启动深度打捞..."
          # 定义多个可能的固件生成路径，防止目录不存在报错
          SEARCH_PATHS="bin/targets/ build_dir/target-aarch64_*/linux-mediatek_filogic/"
          
          # 仅打捞大于 10MB 的有效固件并压缩
          find $SEARCH_PATHS -type f -size +10M -name "*sysupgrade.bin" 2>/dev/null | while read -r img; do
            echo "📦 发现并压缩固件: $img"
            gzip -9 -c "$img" > "../release_bins/$(basename "$img").gz"
          done
          
          # 打捞非空清单文件
          find $SEARCH_PATHS -type f -size +1c -name "*.manifest" 2>/dev/null -exec cp -v {} ../release_bins/ \;
          
          # 检查提取结果
          ls -lh ../release_bins/

      - name: "11. 发布固件"
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: SL3000-Final-v3.0-${{ github.run_id }}
          files: release_bins/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "12. 强制保存缓存 (无论成败)"
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.WORKDIR }}/dl
            ${{ env.WORKDIR }}/staging_dir
            ${{ env.WORKDIR }}/build_dir/host
          key: ${{ runner.os }}-sl3000-v3-${{ github.run_id }}
