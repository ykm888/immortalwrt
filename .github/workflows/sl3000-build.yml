name: SL3000-Official-Firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 检出代码（静默模式，无多余日志）
      - name: Checkout Configs
        uses: actions/checkout@v4
        with:
          path: configs
          quiet: true  # 关闭检出时的冗余日志

      # 2. 安装依赖（静默模式，屏蔽 apt 警告）
      - name: Install Dependencies
        run: |
          # 静默更新+安装，仅输出错误
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential subversion libncurses5-dev zlib1g-dev gawk gcc-multilib \
            flex git-core gettext libssl-dev unzip texinfo libtool bison sharutils \
            curl wget rsync python3 python3-pip python3-setuptools python3-yaml \
            quilt patchutils m4 bc xz-utils libexpat1-dev libz-dev > /dev/null 2>&1
        continue-on-error: false

      # 3. 克隆源码（静默模式，屏蔽 git 警告）
      - name: Clone ImmortalWrt Official
        run: |
          # 强制删除旧目录，静默克隆
          rm -rf openwrt > /dev/null 2>&1
          git clone --depth=1 -b openwrt-24.10 --quiet https://github.com/immortalwrt/immortalwrt.git openwrt > /dev/null 2>&1

      # 4. 复制配置（静默模式，屏蔽 cp 警告）
      - name: Copy Custom Configs
        run: |
          # 静默创建目录、复制文件，仅输出错误
          mkdir -p openwrt/target/linux/mediatek/{dts,image} > /dev/null 2>&1
          cp -fv configs/custom-config/mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/ > /dev/null 2>&1
          cp -fv configs/custom-config/filogic.mk openwrt/target/linux/mediatek/image/ > /dev/null 2>&1
          # 追加 DTS 编译列表，屏蔽重复警告
          grep -q "mt7981b-sl3000-emmc.dtb" openwrt/target/linux/mediatek/dts/Makefile || \
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> openwrt/target/linux/mediatek/dts/Makefile > /dev/null 2>&1

      # 5. 生成配置（屏蔽 defconfig 冗余警告）
      - name: Generate Official Config
        working-directory: ./openwrt
        run: |
          # 生成基础配置，静默写入
          cat > .config << EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_SILENT_BUILD=y  # 开启静默编译，关闭大部分警告
          CONFIG_SILENT_PRINT_ON_ERROR=y  # 仅在报错时输出详细信息
          EOF
          # 合并用户配置，屏蔽空文件警告
          [ -f ../configs/custom-config/sl3000.config ] && cat ../configs/custom-config/sl3000.config >> .config 2>/dev/null
          # 静默生成配置，仅输出错误
          make defconfig > /dev/null 2>&1

      # 6. 编译（静默模式，仅保留关键日志）
      - name: Build Firmware
        working-directory: ./openwrt
        run: |
          # 静默下载依赖，仅输出错误
          make download -j$(nproc) > /dev/null 2>&1
          # 单线程静默编译，仅在报错时显示详细日志
          make -j1 V=s SILENT=1  # SILENT=1 屏蔽编译过程中的冗余警告

      # 7. 上传产物（静默模式）
      - name: Upload All Outputs
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-All-Outputs
          path: openwrt/bin/targets/mediatek/filogic/*
          quiet: true  # 关闭上传时的冗余日志
