name: Build_SL3000
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk libncurses-dev libssl-dev python3 git

      - name: Clone ImmortalWrt
        run: |
          rm -rf openwrt
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Copy device files
        run: |
          mkdir -p openwrt/target/linux/mediatek/dts
          mkdir -p openwrt/target/linux/mediatek/image
          cp custom-config/mt7981b-sl3000-emmc.dts openwrt/target/linux/mediatek/dts/
          cp custom-config/filogic.mk openwrt/target/linux/mediatek/image/

      # ✅ 核心修正：恢复你仓库实际存在的脚本名 sl3000-patch.sh
      - name: Run patch script
        run: |
          chmod +x scripts/sl3000-patch.sh
          cd openwrt
          ../scripts/sl3000-patch.sh

      - name: Create .config
        working-directory: ./openwrt
        run: |
          : > .config
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config

      - name: make defconfig
        working-directory: ./openwrt
        run: make defconfig

      - name: Download all packages
        working-directory: ./openwrt
        run: make download -j4

      # --------------------------------------------------
      # 第一步：单独构建工具链
      # --------------------------------------------------
      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make tools/install -j1 V=s
          make toolchain/install -j1 V=s

      # --------------------------------------------------
      # 第二步：单独构建固件
      # --------------------------------------------------
      - name: Build Firmware
        working-directory: ./openwrt
        run: |
          make target/linux/compile -j1 V=s
          make package/compile -j1 V=s
          make package/install -j1 V=s
          make target/install -j1 V=s
          make image/install -j1 V=s

      - name: Show firmware files
        working-directory: ./openwrt
        run: ls -lh bin/targets/mediatek/filogic/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/targets/mediatek/filogic/*
