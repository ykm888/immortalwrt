name: SL-3000-24.10-Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: custom-config/sl3000.config
  DIY_SH: scripts/sl3000-patch.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y $(curl -fsSL https://raw.githubusercontent.com/p3terx/Actions-OpenWrt/main/debian-11-setup)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Physical Patch & Update Feeds
      run: |
        cd openwrt
        cp ../$DIY_SH ./patch.sh
        chmod +x patch.sh
        ./patch.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & Re-Patch
      run: |
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        ./patch.sh # 第二次运行确保覆盖 .config 里的错误项
        make defconfig

    - name: Compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Firmware
        path: openwrt/bin/targets/mediatek/filogic/
