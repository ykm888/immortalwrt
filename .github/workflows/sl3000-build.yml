name: Build_SL3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: "🚀 环境初始化"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /var/lib/docker || true
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            gettext-base git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-pyelftools rsync unzip zlib1g-dev swig libpython3-dev \
            device-tree-compiler wget curl file
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "Swap Skip"

      - name: Clone ImmortalWrt
        run: git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Run patch script
        run: |
          chmod +x scripts/sl3000-patch.sh
          ./scripts/sl3000-patch.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          # 全链路物理强制标志
          make tools/install -j$(nproc) FORCE=1 || make tools/install -j1 V=s FORCE=1
          make toolchain/install -j$(nproc) FORCE=1 || make toolchain/install -j1 V=s FORCE=1

      - name: "🔥 内核编译与 DTS 注入"
        working-directory: ./openwrt
        run: |
          make target/linux/compile -j$(nproc) FORCE=1 || make target/linux/compile -j1 V=s FORCE=1
          DTS_SRC="${{ github.workspace }}/custom-config/mt7981b-sl3000-emmc.dts"
          find build_dir -path "*/arch/arm64/boot/dts/mediatek" -type d | while read -r dts_path; do
            cp -fv "$DTS_SRC" "$dts_path/"
            [ -f "$dts_path/Makefile" ] && ! grep -q "mt7981b-sl3000-emmc.dtb" "$dts_path/Makefile" && \
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt7981b-sl3000-emmc.dtb' >> "$dts_path/Makefile"
          done

      - name: Build Firmware
        working-directory: ./openwrt
        run: |
          make defconfig FORCE=1
          make package/compile -j$(nproc) FORCE=1 || make package/compile -j1 V=s FORCE=1
          make package/install -j$(nproc) FORCE=1 || make package/install -j1 V=s FORCE=1
          
          # 🔥 [物理强灌] 核心修复：即使 Makefile 报错，也强制传递分区参数
          make target/linux/install -j$(nproc) DEVICE_sl3000-emmc=y \
            CONFIG_TARGET_KERNEL_PARTSIZE=128 \
            CONFIG_TARGET_ROOTFS_PARTSIZE=1024 FORCE=1 2>&1 | tee build.log || \
          make target/linux/install -j1 V=s DEVICE_sl3000-emmc=y \
            CONFIG_TARGET_KERNEL_PARTSIZE=128 \
            CONFIG_TARGET_ROOTFS_PARTSIZE=1024 FORCE=1 2>&1 | tee build.log

      - name: "🛡️ [物理自检] 结果回溯"
        working-directory: ./openwrt
        if: always()
        run: |
          echo "==================== 🔎 物理审计 ===================="
          FIRMWARE_DIR="bin/targets/mediatek/filogic"
          if [ -d "$FIRMWARE_DIR" ] && [ "$(ls -A $FIRMWARE_DIR/*sysupgrade.bin 2>/dev/null)" ]; then
            echo "✅ 成功：固件已生成"
            ls -lh $FIRMWARE_DIR/*sysupgrade.bin
          else
            echo "❌ 失败：正在抓取关键错误日志..."
            [ -f "build.log" ] && tail -n 100 build.log || echo "无日志记录"
            echo "📊 检查最终 .config 状态："
            grep "CONFIG_TARGET_KERNEL_PARTSIZE" .config || echo "变量未命中"
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SL3000-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
